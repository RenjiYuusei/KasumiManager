name: Build & Publish Release App

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (leave empty to use app version, e.g. v1.1.2)'
        required: false
        default: ''

concurrency:
  group: "release"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.keyAlias }}
          SIGNING_KEY_PASSWORD: ${{ secrets.keyPassword }}
          SIGNING_STORE_PASSWORD: ${{ secrets.keystorePassword }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE: true
        run: |
          if [ -n "${{ secrets.keystore }}" ]; then
            echo "${{ secrets.keystore }}" | base64 -d > release.keystore
          fi
          ./gradlew :app:packageRelease --stacktrace
          rm -f release.keystore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [ "$tag" = "main" ] || [ -z "$tag" ]; then
            tag="v$(grep -m1 'versionName' app/build.gradle.kts | cut -d '"' -f 2)"
          fi
          apk_file="kasumi-manager-$tag.apk"
          mv -T ./app/build/outputs/apk/release/app-release.apk "./$apk_file"

          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            "./$apk_file" || gh release upload "$tag" "./$apk_file" --clobber
